  - id: contested.psychology.implicit_association_test
    keywords: ["implicit bias test", "Implicit Association Test", "IAT predicts discrimination", "unconscious bias measure"]
    question: "Does the Implicit Association Test predict discriminatory behaviour?"
    domain: social-science/psychology
    note: >-
      Two meta-analyses of the same literature reach different conclusions about how well
      the test predicts behaviour, and the construct itself (what the test measures) is
      also disputed.
    positions:
      - label: "it predicts behaviour, at least in aggregate"
        claim: >-
          IAT scores predict behavioural outcomes, and in socially sensitive domains
          they predict better than self-report measures.
        falsifiable: true
        falsified_if: >-
          Preregistered studies with behavioural outcomes find correlations near zero
          after accounting for explicit attitudes.
        falsifiability_status: scientific
        evidence_pointers: ["Greenwald et al. 2009, J Pers Soc Psychol, doi:10.1037/a0015575"]
      - label: "predictive validity is weak, especially for individuals"
        claim: >-
          IAT scores are poor predictors of discriminatory behaviour, and are not
          reliable enough to be used to judge an individual.
        falsifiable: true
        falsified_if: >-
          Studies with reliable behavioural measures find predictive correlations well
          above those in the critical meta-analysis, for individuals as well as groups.
        falsifiability_status: scientific
        evidence_pointers: ["Oswald et al. 2013, J Pers Soc Psychol, doi:10.1037/a0032734"]
      - label: "it measures something, but what is not settled"
        claim: >-
          The test measures an association, but whether that is a stable attitude, a
          cultural association or a task artifact is unresolved, so prediction claims
          outrun the construct.
        falsifiable: true
        falsified_if: >-
          Convergent evidence from independent methods identifies one construct and shows
          the test measures it reliably.
        falsifiability_status: scientific
        evidence_pointers: ["construct validity debates", "test-retest reliability studies"]
    engine_directive: "present_all_positions_with_falsifiability; do_not_pick_winner"

  - id: contested.linguistics.universal_grammar
    keywords: ["universal grammar", "innate language faculty", "Chomsky language acquisition", "language instinct", "language universals"]
    question: "Is language acquisition guided by an innate, language-specific faculty (universal grammar)?"
    domain: linguistics/psycholinguistics
    note: >-
      Whether this can be tested depends on which properties are claimed to be universal
      and innate. A claim that names none is hard to falsify, and a claim that names
      specific structures can be tested against the world's languages and against what
      learners acquire.
    positions:
      - label: "a rich innate faculty with universal structure"
        claim: >-
          Children are born with a language-specific endowment containing the principles
          common to all human languages.
        falsifiable: depends
        falsified_if: >-
          Depends on listing the specific innate principles. Once listed, a language
          spoken by a normal community that lacks one, or learners shown to acquire it from
          the input with domain-general learning alone, would count against it.
        falsifiability_status: conditional
        evidence_pointers: ["the Chomskyan tradition (books, no DOI)", "poverty-of-the-stimulus arguments"]
      - label: "a minimal innate endowment, with most structure learned"
        claim: >-
          What is innate and specific to language is small (for example, the capacity for
          recursion), and much of the rest comes from general cognition and learning.
        falsifiable: true
        falsified_if: >-
          Evidence that the proposed core capacity is absent in some normal speakers, or
          present in the same form in other species' communication.
        falsifiability_status: scientific
        evidence_pointers: ["Hauser, Chomsky & Fitch 2002, Science, doi:10.1126/science.298.5598.1569"]
      - label: "usage and general learning explain acquisition; universals are tendencies"
        claim: >-
          Languages differ more than the universal-grammar view predicts, and general
          learning from experience explains acquisition.
        falsifiable: true
        falsified_if: >-
          Learners are shown to acquire a structure that no general-purpose learner could
          acquire from the same input, or the cross-linguistic universals are shown to
          hold without exception.
        falsifiability_status: scientific
        evidence_pointers: ["Evans & Levinson 2009, Behavioral and Brain Sciences, doi:10.1017/S0140525X0999094X"]
    engine_directive: "present_all_positions_with_falsifiability; do_not_pick_winner"
