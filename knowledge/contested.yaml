    domain: social-science/psychology
    note: >-
      A famous early result, followed by replications and meta-analyses that disagree
      about the size of the effect and about whether it appears in real testing
      settings.
    positions:
      - label: "a reliable effect"
        claim: >-
          Awareness of a negative stereotype about one's group reliably lowers
          performance on a relevant test.
        falsifiable: true
        falsified_if: >-
          Preregistered, adequately powered replications across settings find no effect.
        falsifiability_status: scientific
        evidence_pointers: ["Steele & Aronson 1995, J Pers Soc Psychol, doi:10.1037/0022-3514.69.5.797"]
      - label: "small effects, inflated by publication bias"
        claim: >-
          Average effects are small, and the larger early results are explained by
          publication bias and flexible analysis.
        falsifiable: true
        falsified_if: >-
          Preregistered replications find effects as large as the early studies.
        falsifiability_status: scientific
        evidence_pointers: ["Flore & Wicherts 2015, J School Psychol, doi:10.1016/j.jsp.2014.10.002"]
      - label: "effects are limited in operational testing settings"
        claim: >-
          Where the conditions look like real high-stakes tests, effects are small or
