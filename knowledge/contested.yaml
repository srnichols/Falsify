        falsifiable: true
        falsified_if: >-
          Studies in real high-stakes settings find effects comparable to the laboratory.
        falsifiability_status: scientific
        evidence_pointers: ["Shewach et al. 2019, J Applied Psychology, doi:10.1037/apl0000420"]
    engine_directive: "present_all_positions_with_falsifiability; do_not_pick_winner"

  - id: contested.education.growth_mindset_interventions
