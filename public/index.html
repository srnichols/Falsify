<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Falsify</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <div class="shell">
      <header class="side">
        <a class="brand" href="#/dashboard" aria-label="Falsify, go to the dashboard">
          <span class="mark" aria-hidden="true">F</span>
          <span class="brand-text">
            <strong>Falsify</strong>
            <small>Follow the data, not the conclusion</small>
          </span>
        </a>

        <nav class="nav" aria-label="Main">
          <a href="#/dashboard" data-route="dashboard"><span class="ico" aria-hidden="true">◧</span>Dashboard</a>
          <a href="#/inquiry" data-route="inquiry"><span class="ico" aria-hidden="true">?</span>Inquiry</a>
          <a href="#/sessions" data-route="sessions"><span class="ico" aria-hidden="true">≡</span>Sessions</a>
          <a href="#/knowledge" data-route="knowledge"><span class="ico" aria-hidden="true">▤</span>Knowledge</a>
          <a href="#/tools" data-route="tools"><span class="ico" aria-hidden="true">⚙</span>Tools</a>
          <a href="#/outcomes" data-route="outcomes"><span class="ico" aria-hidden="true">✓</span>Outcomes</a>
          <a href="#/notebook" data-route="notebook"><span class="ico" aria-hidden="true">✎</span>Notebook</a>
        </nav>

        <p class="side-note">
          A completed cycle records that the <em>process</em> was followed. It is not proof.
        </p>
      </header>

      <main id="main" tabindex="-1">
        <div id="view"></div>
        <noscript>
          <p class="callout callout-warn">Falsify's dashboard needs JavaScript. The MCP tools work without it.</p>
        </noscript>
      </main>
    </div>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
